---
name: Far Side Comic
strategy: polling
polling_verb: get
polling_url: https://comiccaster.xyz/feeds/farside-daily.xml
polling_headers: |
  Accept: application/rss+xml, application/xml;q=0.9, */*;q=0.8
refresh_interval: 360
no_screen_padding: "yes"
dark_mode: "no"
framework_version: 2.0
custom_fields:
  - keyname: show_caption
    field_type: string
    type: string
    name: Show caption
    label: Show caption
    description: Use yes to show the Far Side caption under the comic, or no to hide it.
    placeholder: "yes"
    default: "yes"
  - keyname: image_color_mode
    field_type: select
    type: string
    name: Image color
    label: Image color
    description: Keep grayscale for black-and-white devices, or pass through the original comic colors for color-capable devices.
    default: grayscale
    options:
      - Grayscale: grayscale
      - Original color: original
