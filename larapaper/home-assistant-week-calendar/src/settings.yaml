name: Home Assistant Week Calendar
no_screen_padding: no
dark_mode: no
strategy: polling
polling_verb: get
polling_url: |
  https://{{ home_assistant_domain }}/api/calendars/calendar.{{ calendar_entity_id }}?start={{ "now" | date: "%s" | minus: 604800 | date: "%Y-%m-%d" }}T00:00:00Z&end={{ "now" | date: "%s" | plus: 691200 | date: "%Y-%m-%d" }}T00:00:00Z
polling_headers: |
  Authorization: Bearer {{ api_token }}
  Content-Type: application/json
refresh_interval: 15
framework_version: 2.0
custom_fields:
  - keyname: api_token
    field_type: password
    type: password
    name: Home Assistant API token
    label: API token
    description: Long-lived access token used to read Home Assistant calendar data.
  - keyname: home_assistant_domain
    field_type: string
    type: string
    name: Home Assistant domain
    label: Home Assistant domain
    description: Domain of your Home Assistant instance, without https://.
    placeholder: ha.example.com
  - keyname: calendar_entity_id
    field_type: string
    type: string
    name: Calendar entity ID
    label: Calendar entity ID
    description: Entity ID without the calendar. prefix.
    placeholder: my_calendar
  - keyname: calendar_view
    field_type: select
    type: string
    name: Calendar view
    label: Calendar view
    description: Show the full current week or a roomier three-day view.
    default: current_week
    options:
      - Current week: current_week
      - Next 3 days: next_3_days
  - keyname: timezone
    field_type: string
    type: string
    name: Timezone
    label: Timezone
    description: IANA timezone used to place events in the calendar.
    placeholder: America/Denver
    default: America/Denver
